version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kontago-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kontago
      POSTGRES_PASSWORD: kontago
      POSTGRES_DB: kontago
    ports:
      - "5433:5432"
    volumes:
      - kontago_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kontago-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kontago_redis_data:/data

volumes:
  kontago_postgres_data:
  kontago_redis_data: